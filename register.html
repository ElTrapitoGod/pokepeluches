<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeluPoké · Crear cuenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="page">

    <aside class="hero">
      <div class="hero-content">
        <div class="brand">
          <span class="ball"></span>
          <span class="brand-name">PeluPoké</span>
        </div>
        <h1>Tu primera captura<br>empieza aquí.</h1>
        <p>Crea tu cuenta de entrenador y desbloquea la tienda completa.</p>

        <div class="stack">
          <div class="plush plush-a"></div>
          <div class="plush plush-b"></div>
          <div class="plush plush-c"></div>
        </div>
      </div>
    </aside>

    <main class="form-panel">
      <div class="form-card">
        <h2>Crea tu cuenta</h2>
        <p class="subtitle">Solo toma un minuto.</p>

        <form id="register-form" novalidate>
          <label for="name">Nombre</label>
          <input type="text" id="name" name="name" placeholder="Tu nombre" autocomplete="name" required />

          <label for="email">Correo</label>
          <input type="email" id="email" name="email" placeholder="entrenador@correo.com" autocomplete="email" required />

          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" minlength="6" required />

          <button type="submit" id="register-btn">Crear cuenta</button>

          <p id="form-message" class="message" role="status"></p>
        </form>

        <p class="switch">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
