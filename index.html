<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeluPoké · Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="page">

    <aside class="hero">
      <div class="hero-content">
        <div class="brand">
          <span class="ball"></span>
          <span class="brand-name">PeluPoké</span>
        </div>
        <h1>Peluches que quieres<br>atrapar a abrazos.</h1>
        <p>Coleccionables suaves de tus criaturas favoritas, directo a tu mochila.</p>

        <div class="stack">
          <div class="plush plush-a"></div>
          <div class="plush plush-b"></div>
          <div class="plush plush-c"></div>
        </div>
      </div>
    </aside>

    <main class="form-panel">
      <div class="form-card">
        <h2>Entra a tu cuenta</h2>
        <p class="subtitle">Revisa tus pedidos y tu lista de captura.</p>

        <form id="login-form" novalidate>
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" placeholder="entrenador@correo.com" autocomplete="email" required />

          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />

          <button type="submit" id="login-btn">Iniciar sesión</button>

          <p id="form-message" class="message" role="status"></p>
        </form>

        <p class="switch">¿Aún no tienes cuenta? <a href="register.html">Regístrate</a></p>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
