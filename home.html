<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FenneStore · Tienda</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/marca.css" />
  <link rel="stylesheet" href="css/catalogo.css" />
</head>
<body class="dashboard-body">

  <header class="topbar">
    <a class="brand" href="index.html"><img class="brand-logo" data-img="logo" alt="" width="36" height="36"><span class="brand-name">Fenne<span>Store</span></span></a>
    <div class="buscador">
      <input id="busqueda" type="search" placeholder="Buscar peluches, llaveros…" aria-label="Buscar en la tienda" autocomplete="off" />
    </div>
    <div class="topbar-acciones">
      <button id="btn-carrito" class="carrito-btn" type="button" aria-label="Abrir carrito"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2.5l2 11h10l2-8H7"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg><span id="carrito-contador" hidden>0</span></button>
      <button id="logout-btn" class="ghost-btn">Cerrar sesión</button>
    </div>
  </header>

  <main class="dashboard">
    <section class="intro">
      <h1 id="welcome">Cargando tu cuenta…</h1>
      <p class="subtitle">Elige a tu próximo compañero de aventuras.</p>
    </section>

    <div id="chips" class="chips" role="group" aria-label="Filtrar por categoría"></div>

    <div class="seccion-titulo">
      <h2>Catálogo</h2>
      <span id="contador">3 artículos</span>
    </div>

    <section id="catalogo" class="catalogo-grid"></section>

    <div id="sin-resultados" class="vacio" hidden>
      <p id="sin-texto"></p>
      <button id="limpiar" class="ghost-btn" type="button">Limpiar filtros</button>
    </div>
  </main>

  <div id="carrito-fondo" class="carrito-fondo" hidden></div>
  <aside id="carrito-panel" class="carrito-panel" role="dialog" aria-modal="true" aria-labelledby="carrito-titulo" hidden>
    <div class="carrito-cabecera">
      <h2 id="carrito-titulo">Tu carrito</h2>
      <button id="carrito-cerrar" class="carrito-cerrar" type="button" aria-label="Cerrar carrito">×</button>
    </div>
    <p id="carrito-vacio" class="carrito-vacio">Tu carrito está vacío. ¡Explora el catálogo y agrega algo!</p>
    <ul id="carrito-lista"></ul>
    <div class="carrito-pie">
      <div class="carrito-total"><span>Total</span><strong id="carrito-total">$0 MXN</strong></div>
      <p class="carrito-nota">El pago estará disponible próximamente.</p>
    </div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/imagenes.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/tienda.js"></script>
  <script>
    // Protege la página: si no hay sesión, regresa al login
    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
        return;
      }
      const name = session.user.user_metadata?.full_name || session.user.email;
      document.getElementById("welcome").textContent = `¡Hola, ${name}!`;

      // Con sesión válida, arranca la tienda (catálogo, buscador y carrito)
      iniciarTienda(session);
    }

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    });

    checkSession();
  </script>
</body>
</html>
